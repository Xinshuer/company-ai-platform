[project]
name = "corpai"
version = "0.1.0"
description = "Simulated internal AI platform for a fictional 70-person company: permission-aware RAG, MCP, LangGraph, routed models, audit"
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "evals"]
addopts = "-q --import-mode=importlib"
markers = [
    "security: permission matrix, routing canaries, chaos, red team",
    "eval: evaluation suites (fake LLM unless CORPAI_LLM=live)",
    "live: calls the real DeepSeek API; skipped unless CORPAI_LLM=live",
    "slow: takes more than a few seconds",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
