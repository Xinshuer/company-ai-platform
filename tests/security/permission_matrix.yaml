      - {column: staff, cell: "写草稿 (no self sign-off)", persona: finance_staff, action: approve, resource: prop_journal, expect: deny}
      - {column: head, cell: 签核, persona: finance_head, action: approve, resource: prop_journal, expect: allow}
      - {column: head, cell: 签核, persona: finance_head, action: read, resource: statement, expect: allow}
      - {column: other, cell: 只看已发布的指标, persona: eng_staff, action: read, resource: metric_published, expect: allow}
      - {column: other, cell: 只看已发布的指标, persona: eng_staff, action: read, resource: metric_draft, expect: deny}
      - {column: other, cell: 只看已发布的指标, persona: sales_head, action: read, resource: journal, expect: deny}
      - {column: other, cell: 只看已发布的指标, persona: sales_head, action: read, resource: statement, expect: deny}
      - {column: ceo, cell: 读, persona: ceo, action: read, resource: statement, expect: allow}
      - {column: ceo, cell: 读, persona: ceo, action: read, resource: journal, expect: allow}
