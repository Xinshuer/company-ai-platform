      - {column: staff, cell: 经办字段，薪资屏蔽, persona: hr_staff, action: read, resource: comp_eng_staff, expect: deny}
      - {column: staff, cell: 经办字段，薪资屏蔽, persona: hr_staff, action: read, resource: perf_eng_staff, expect: deny}
      - {column: head, cell: 读, persona: hr_head, action: read, resource: comp_eng_staff, expect: allow}
      - {column: head, cell: 读, persona: hr_head, action: read, resource: perf_eng_staff, expect: allow}
      - {column: head, cell: 读, persona: hr_head, action: read, resource: hr_aggregate, expect: allow, obligations: [aggregate_only, min_group_5]}
      - {column: other, cell: 经理可看直属下级的非薪资字段, persona: eng_head, action: read, resource: emp_eng_staff, expect: allow}
      - {column: other, cell: 经理可看直属下级的非薪资字段, persona: eng_head, action: read, resource: comp_eng_staff, expect: deny}
      - {column: other, cell: 经理可看直属下级的非薪资字段, persona: eng_head, action: read, resource: emp_sales_staff, expect: deny}
      - {column: other, cell: (staff of other depts), persona: sales_staff, action: read, resource: emp_eng_staff, expect: deny}
      - {column: other, cell: "经理可看直属下级的非薪资字段 (no company-wide HR aggregates)", persona: sales_head, action: read, resource: hr_aggregate, expect: deny}
      - {column: other, cell: "经理可看直属下级的非薪资字段 (no company-wide HR aggregates)", persona: eng_head, action: read, resource: hr_aggregate, expect: deny}
      - {column: other, cell: "经理可看直属下级的非薪资字段 (no company-wide HR aggregates)", persona: finance_head, action: read, resource: hr_aggregate, expect: deny}
      - {column: other, cell: "经理可看直属下级的非薪资字段 (another dept's pay aggregate)", persona: sales_head, action: read, resource: hr_agg_eng_pay, expect: deny}
      - {column: other, cell: "经理可看直属下级的非薪资字段 (own dept pay aggregate)", persona: eng_head, action: read, resource: hr_agg_eng_pay, expect: deny}
      - {column: other, cell: "(own dept headcount only)", persona: eng_head, action: read, resource: hr_agg_eng_headcount, expect: allow, obligations: [aggregate_only, min_group_5]}
      - {column: other, cell: "(own dept headcount only)", persona: sales_head, action: read, resource: hr_agg_eng_headcount, expect: deny}
      - {column: ceo, cell: 部门级汇总（n<5 不展示）, persona: ceo, action: read, resource: hr_aggregate, expect: allow, obligations: [aggregate_only, min_group_5]}
      - {column: ceo, cell: 部门级汇总（n<5 不展示）, persona: ceo, action: read, resource: comp_eng_staff, expect: deny}
      - {column: ceo, cell: 部门级汇总（n<5 不展示）, persona: ceo, action: read, resource: emp_eng_staff, expect: deny}
      - {column: platform_admin, cell: 否, persona: platform_admin, action: read, resource: emp_eng_staff, expect: deny}
      - {column: platform_admin, cell: 否, persona: platform_admin, action: read, resource: hr_aggregate, expect: deny}

  - row: "简历、候选人 (L3–L4)"
    cases:
      - {column: staff, cell: 经办岗位, persona: hr_staff, action: read, resource: cand_r1, expect: allow}
      - {column: staff, cell: 经办岗位, persona: hr_staff, action: read, resource: cand_r2, expect: deny}
      - {column: staff, cell: 经办岗位, persona: hr_staff, action: read, resource: screening_r1, expect: allow}
      - {column: head, cell: 读, persona: hr_head, action: read, resource: cand_r2, expect: allow}
      - {column: other, cell: 用人经理看本岗位候选人, persona: eng_head, action: read, resource: cand_r1, expect: allow}
      - {column: other, cell: 用人经理看本岗位候选人, persona: eng_head, action: read, resource: cand_r2, expect: deny}
      - {column: other, cell: 用人经理看本岗位候选人, persona: sales_head, action: read, resource: cand_r1, expect: deny}
      - {column: ceo, cell: 默认否, persona: ceo, action: read, resource: cand_r1, expect: deny}
      - {column: ceo, cell: 默认否, persona: ceo, action: read, resource: screening_r1, expect: deny}
      - {column: platform_admin, cell: 否, persona: platform_admin, action: read, resource: cand_r1, expect: deny}

  - row: "管理层报告 (继承最高)"
    cases:
      - {column: staff, cell: 否, persona: finance_staff, action: read, resource: report_finance, expect: deny}
      - {column: staff, cell: 否, persona: eng_staff, action: read, resource: report_eng, expect: deny}
      - {column: head, cell: 本领域报告, persona: finance_head, action: read, resource: report_finance, expect: allow}
      - {column: head, cell: 本领域报告, persona: finance_head, action: read, resource: report_eng, expect: deny}
      - {column: other, cell: 各负责人按自己的权限取数, persona: eng_head, action: read, resource: report_eng, expect: allow}
      - {column: other, cell: 各负责人按自己的权限取数, persona: eng_head, action: read, resource: report_finance, expect: deny}
      - {column: ceo, cell: 全部, persona: ceo, action: read, resource: report_finance, expect: allow}
      - {column: ceo, cell: 全部, persona: ceo, action: export, resource: report_eng, expect: allow, obligations: [watermark]}
      - {column: platform_admin, cell: 否, persona: platform_admin, action: read, resource: report_eng, expect: deny}

  - row: "Playbook (按内容)"
    cases:
      - {column: staff, cell: 读，可提建议, persona: sales_staff, action: read, resource: playbook_sales, expect: allow}
      - {column: staff, cell: 读，可提建议, persona: sales_staff, action: propose, resource: playbook_sales, expect: allow}
      - {column: head, cell: 批准发布, persona: sales_head, action: read, resource: playbook_sales, expect: allow}
      - {column: head, cell: 批准发布, persona: legal_head, action: propose, resource: playbook_legal, expect: allow}
      - {column: other, cell: "按级别 (§5.1: playbook ACL is the owning dept)", persona: eng_staff, action: read, resource: playbook_sales, expect: deny}
      - {column: other, cell: 按级别, persona: sales_staff, action: read, resource: playbook_legal, expect: deny}
      - {column: ceo, cell: 读, persona: ceo, action: read, resource: playbook_legal, expect: allow}
      - {column: platform_admin, cell: 否, persona: platform_admin, action: read, resource: playbook_legal, expect: deny}
      - {column: platform_admin, cell: 否, persona: platform_admin, action: read, resource: playbook_sales, expect: deny}

  - row: "trace 内容 (继承)"
    cases:
      - {column: staff, cell: "否 (others' runs)", persona: sales_staff, action: read, resource: trace_sales_peer, expect: deny}
      - {column: staff, cell: "own runs (architecture §9: the requester sees their own runs)", persona: sales_staff, action: read, resource: trace_sales_own, expect: allow}
      - {column: head, cell: 只看本部门聚合指标, persona: sales_head, action: read, resource: trace_sales_peer, expect: allow, obligations: [aggregate_only]}
      - {column: other, cell: 否, persona: eng_head, action: read, resource: trace_sales_peer, expect: deny}
      - {column: other, cell: 否, persona: finance_staff, action: read, resource: trace_sales_own, expect: deny}
      - {column: ceo, cell: 否, persona: ceo, action: read, resource: trace_sales_peer, expect: deny}
      - {column: platform_admin, cell: 只看脱敏元数据；排障看原文走 break-glass, persona: platform_admin, action: read, resource: trace_sales_peer, expect: allow, obligations: [metadata_only]}

  - row: "审计日志"
    cases:
      - {column: staff, cell: 否, persona: sales_staff, action: read, resource: audit_log, expect: deny}
      - {column: head, cell: 否, persona: finance_head, action: read, resource: audit_log, expect: deny}
      - {column: other, cell: 否, persona: hr_staff, action: read, resource: audit_log, expect: deny}
      - {column: ceo, cell: 否, persona: ceo, action: read, resource: audit_log, expect: deny}
      - {column: platform_admin, cell: 否（只有安全审计员可读）, persona: platform_admin, action: read, resource: audit_log, expect: deny}
      - {column: platform_admin, cell: 只有安全审计员可读, persona: auditor, action: read, resource: audit_log, expect: allow}
      - {column: platform_admin, cell: 只有安全审计员可读, persona: auditor, action: export, resource: audit_log, expect: allow, obligations: [watermark]}

# 简历、候选人 · 用人经理看本岗位候选人 (issues-log D-05): the tool side of the row above. A hiring
# manager (holding req:<id>; the fabricated eng_head holds req:R-01) may use hris.list_candidates and
# hris.get_candidate; RLS limits rows to that requisition. Checked by tests/hr/test_hiring_manager_rule.py
# through the requested read-only agent `hr_candidates` (tools list_requisitions, list_candidates,
# get_candidate; started by employees, managers and the CEO). `rule` is the deciding rule id.
hiring_manager_tools:
  - {persona: eng_head, tool: hris.list_candidates, expect: allow, rule: tool-hris-hiring-manager}
  - {persona: eng_head, tool: hris.get_candidate, expect: allow, rule: tool-hris-hiring-manager}
  - {persona: eng_head, tool: hris.create_requisition, expect: deny, rule: agent-allowlist}
  - {persona: hr_staff, tool: hris.list_candidates, expect: allow, rule: tool-hris-hr}
  - {persona: hr_head, tool: hris.get_candidate, expect: allow, rule: tool-hris-hr}
  - {persona: sales_head, tool: hris.list_candidates, expect: deny, rule: default-deny}
  - {persona: ceo, tool: hris.get_candidate, expect: deny, rule: default-deny}
  - {persona: eng_staff, tool: hris.list_candidates, expect: deny, rule: default-deny}
  - {persona: finance_head, tool: hris.get_candidate, expect: deny, rule: default-deny}
  - {persona: platform_admin, tool: hris.list_candidates, expect: deny, rule: agent-start-denied}
  - {persona: auditor, tool: hris.get_candidate, expect: deny, rule: agent-start-denied}
